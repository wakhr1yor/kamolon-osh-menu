<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kamolon Osh - To'lov Hisobi</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .receipt { background: white; width: 100%; max-width: 360px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 6px solid #1a237e; }
    .logo { text-align: center; margin-bottom: 10px; }
    .logo img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #eee; }
    h2 { text-align: center; margin: 5px 0; color: #1a237e; text-transform: uppercase; font-size: 22px; }
    .info { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th { text-align: left; border-bottom: 2px solid #f0f0f0; padding: 8px 5px; font-size: 12px; color: #999; text-transform: uppercase; }
    td { padding: 12px 5px; border-bottom: 1px dashed #eee; font-size: 15px; color: #333; }
    .r { text-align: right; }
    .summary-box { background-color: #f9f9f9; padding: 15px; border-radius: 10px; }
    .line { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 8px; }
    .total-box { margin-top: 10px; font-weight: bold; font-size: 20px; border-top: 2px solid #1a237e; padding-top: 12px; display: flex; justify-content: space-between; color: #000; }
    .btn { width: 100%; background: #1a237e; color: white; border: none; padding: 16px; border-radius: 12px; margin-top: 25px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
    .btn:active { transform: scale(0.97); background: #0d1245; }
  </style>
</head>
<body>
  <div class="receipt">
    <div class="logo"><img src="logo.png" alt="Kamolon Osh Logo"></div>
    <h2>Kamolon Osh</h2>
    <div class="info"><p><b id="st-display">Stol aniqlanmoqda...</b></p></div>

    <table>
      <thead>
        <tr><th>Taom nomi</th><th class="r">Soni</th><th class="r">Summa</th></tr>
      </thead>
      <tbody id="items-list"></tbody>
    </table>

    <div class="summary-box">
      <div class="line"><span>Taomlar:</span><span id="subtotal">0 soʻm</span></div>
      <div class="line"><span>Xizmat (15%):</span><span id="service-fee">0 soʻm</span></div>
      <div class="total-box"><span>JAMI:</span><span id="final-total">0 soʻm</span></div>
    </div>

    <button class="btn" onclick="callWaiter()">🔔 Ofitsiantni chaqirish</button>
  </div>

  <script>
    async function hisobniChiqarish() {
    const urlParams = new URLSearchParams(window.location.search);
    let stolRaqami = urlParams.get('table') || "0";

    // Stol raqamini ekranga chiqarish
    let stDisplay = document.getElementById('st-display');
    if (stDisplay) {
        stDisplay.innerText = "Stol: " + stolRaqami;
    }

    const tbody = document.getElementById('items-list');
    tbody.innerHTML = "<tr><td colspan='3' style='text-align:center'>Hisob yuklanmoqda...</td></tr>";

    try {
        // RENDER SERVERINGIZGA SO'ROV YUBORAMIZ
        const response = await fetch(`https://kamolon-osh-api.onrender.com/get-bill/${stolRaqami}`);
        const data = await response.json();

        let jamiTaomlarSummasi = 0;
        tbody.innerHTML = ""; // Yuklanmoqda yozuvini o'chiramiz

        // iiko dan kelgan taomlarni jadvalga chiqaramiz
        // Diqqat: iiko API formatiga qarab 'items' yoki 'orderItems' deb o'zgartirish kerak bo'lishi mumkin
        if (data && data.items) {
            data.items.forEach(item => {
                let taomSummasi = item.amount * item.price;
                jamiTaomlarSummasi += taomSummasi;
                tbody.innerHTML += `<tr>
                    <td>${item.name}</td>
                    <td class="r">${item.amount}</td>
                    <td class="r">${taomSummasi.toLocaleString()} so'm</td>
                </tr>`;
            });
        } else {
            tbody.innerHTML = "<tr><td colspan='3' style='text-align:center'>Hozircha faol buyurtma yo'q</td></tr>";
        }

        let xizmatHaqi = jamiTaomlarSummasi * 0.15;
        let yakuniySumma = jamiTaomlarSummasi + xizmatHaqi;

        // Pastki hisob-kitob qismlarini yangilash
        document.getElementById('subtotal').innerText = jamiTaomlarSummasi.toLocaleString() + " so'm";
        document.getElementById('service-fee').innerText = xizmatHaqi.toLocaleString() + " so'm";
        document.getElementById('final-total').innerText = yakuniySumma.toLocaleString() + " so'm";

    } catch (error) {
        console.error("Xatolik:", error);
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red'>Hisobni olib bo'lmadi</td></tr>";
    }
}
    window.onload = hisobniChiqarish;
  </script>
</body>
</html>
